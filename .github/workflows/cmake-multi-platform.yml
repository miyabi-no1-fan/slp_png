# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    paths-ignore: ['README.md', '.gitignore', 'LICENSE']
  pull_request:
    branches: [ "main" ]
    paths-ignore: ['README.md', '.gitignore', 'LICENSE']

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            image: archlinux:latest
          - os: ubuntu-latest
            c_compiler: clang
            image: archlinux:latest

          - os: macos-latest
            c_compiler: clang
            image: ''
        exclude:
          - os: macos-latest
            c_compiler: gcc
    container:
      image: ${{ matrix.image }}
      options: --privileged --cap-add=SYS_PTRACE
    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
    
    - name: Ubuntu install dep
      if: matrix.os == 'ubuntu-latest'
      run: |
        pacman -Syyu --noconfirm
        pacman -Syu --noconfirm base base-devel zlib-ng-compat libspng cmake gcc clang ninja


    - name: macOS install dep
      if: matrix.os == 'macos-latest'
      run: brew install zlib-ng libspng

    - name: Configure CMake (clang)
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      if: matrix.c_compiler == 'clang'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -S ${{ github.workspace }}

    - name: Build (clang)
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      if: matrix.c_compiler == 'clang'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: run clang-tidy check (clang)
      if: matrix.c_compiler == 'clang'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: >
        shopt -s nullglob;
        clang-tidy
        -p build/
        --checks='-*,clang-analyzer-*, -clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling'
        --warnings-as-errors='*'
        src/*/*.c
        src/*.c;
        shopt -u nullglob;
    
    - name: Run CI test (clang)
      if: matrix.c_compiler == 'clang'
      working-directory: ${{ github.workspace }}
      run: ./build/test

    - name: Build (gcc)
      if: matrix.c_compiler == 'gcc'
      working-directory: ${{ github.workspace }}
      run: ./scripts/run.sh dynamic tests/CI_TEST.c build/test -Ofast -mno-avx512f

    - name: Install Valgrind (gcc)
      if: matrix.c_compiler == 'gcc'
      run: pacman -Syu valgrind

    - name: Run CI test with valgrind (gcc)
      if: matrix.c_compiler == 'gcc'
      working-directory: ${{ github.workspace }}
      run: >
        valgrind
        --leak-check=full
        --show-leak-kinds=all
        --errors-for-leak-kinds=all
        --track-origins=yes
        --error-exitcode=1
        ${{ steps.strings.outputs.build-output-dir }}/test
    
    - name: validate CI test output if thread-safe (gcc && clang)
      shell: bash
      working-directory: ${{ github.workspace }}
      run: >
        shopt -s nullglob;
        for file in CI_TEST-*.png; do
            cmp $file CI_TEST.png;
            if [ $? -ne 0 ]; then
                echo \"fail at: cmp $file CI_TEST.png\";
                exit 1;
            fi;
        done;
        shopt -u nullglob;
