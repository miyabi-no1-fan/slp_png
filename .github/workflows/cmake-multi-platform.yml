name: test slp_png

on:
  push:
    branches: [ "main" ]
    paths-ignore: ['README.md', '.gitignore', 'LICENSE']
  pull_request:
    branches: [ "main" ]
    paths-ignore: ['README.md', '.gitignore', 'LICENSE']

jobs:
  test_linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt install build-essential zlib1g-dev gcc clang valgrind llvm cmake make

      - name: Build debug
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-mno-avx512f -Og -g -fno-inline"
          -DENABLE_OPT=OFF
          -DBUILD_TEST=ON -DSLP_IMAGE_TRANSFORM=ON
          -S .
          && cmake --build build --config Debug

      - name: Valgrind test
        shell: bash
        run: |
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all --track-origins=yes --error-exitcode=1 build/test --no-thread_test
      
      - name: Build Release
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_EXAMPLE=ON -DSLP_IMAGE_TRANSFORM=ON
          -S .
          && cmake --build build --config Release

      - name: Run example
        run: build/example && build/example-static

  test_macOS:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install deps
        run: brew install zlib-ng-compat llvm

      - name: Build Release
        shell: bash
        run: >
          export CMAKE_PREFIX_PATH="/opt/homebrew/opt/llvm" &&
          cmake -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON -DSLP_IMAGE_TRANSFORM=ON
          -S .
          && cmake --build build --config Release

      - name: clang-analyzer test
        shell: bash
        run: >
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH" &&
          export LDFLAGS="-L/opt/homebrew/opt/llvm/lib" &&
          export CFLAGS="-I/opt/homebrew/opt/llvm/include" &&
          clang-tidy -p build
          --checks='-*,clang-analyzer-*, -clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling, -clang-diagnostic-unknown-warning-option'
          -extra-arg='-Wno-unknown-warning-option'
          --warnings-as-errors='*'
          src/slp_image_transform/slp_image_transform.c
          src/slp_png_read/slp_png_read_from_file.c
          src/slp_png_write/slp_png_write_to_file.c

      - name: Run test
        shell: bash
        run: |
          set -e
          build/test
          shopt -s nullglob
          set +e
          for file in CI_TEST-*.png; do
            cmp $file CI_TEST.png
            if [ $? -ne 0 ]; then
              echo 'fail at: cmp $file CI_TEST.png'
              exit 1
            fi
          done

  test_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64

      - name: Install deps
        shell: msys2 {0}
        run: pacman -Syuu --needed --overwrite "*" --noconfirm gcc make cmake base base-devel mingw-w64-ucrt-x86_64-zlib-ng-compat

      - name: Build Release
        shell: msys2 {0}
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_EXAMPLE=ON -DSLP_IMAGE_TRANSFORM=ON
          -DCMAKE_PREFIX_PATH=/ucrt64
          -DENABLE_OPT=OFF
          -S .
          && cmake --build build --config Release

      - name: Run example
        shell: msys2 {0}
        run: build/example && build/example-static 
