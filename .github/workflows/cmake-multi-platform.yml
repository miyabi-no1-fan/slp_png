          cmake -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=ON -DBUILD_EXAMPLE=ON -DCMAKE_C_FLAGS="-msse3 -fsanitize=address,undefined -fno-omit-frame-pointer" -S .
