name: test slp_png

on:
  push:
    branches: [ "main" ]
    paths-ignore: ['README.md', 'LICENSE']
  pull_request:
    branches: [ "main" ]
    paths-ignore: ['README.md', '.gitignore', 'LICENSE', '**/MANIFEST.md']

jobs:
  test_linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install build-essential zlib1g-dev gcc clang valgrind llvm cmake make libspng-dev

      - name: Build debug
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_OPT=OFF
          -DBUILD_TEST=ON
          -DBUILD_EXAMPLE=ON
          -DCMAKE_C_FLAGS="-mno-avx512f -Og -g -mavx2"
          -S .
          && cmake --build build --config Debug

      - name: Valgrind test with valid PNGs
        shell: bash
        run: |
          for file in tests/test_images/pngsuite/*.png; do
              echo $file
              valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all  --track-origins=yes --error-exitcode=1 build/test $file
              if [ $? -ne 0 ]; then
                  exit -1
              fi
          done

      - name: Valgrind test with corrupted PNGs
        shell: bash
        run: |
          for file in tests/test_images/pngsuite_corrupted/*.png; do
            echo $file
            valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all  --track-origins=yes --error-exitcode=1 build/example $file
            if [ $? -ne 0 ]; then
              exit -1
            fi
          done


  test_macOS:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install deps
        run: brew install zlib-ng-compat llvm libspng

      - name: Build with generic ARM64
        shell: bash
        run: >
          export CMAKE_PREFIX_PATH="/opt/homebrew/opt/llvm" &&
          cmake -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON
          -DBUILD_EXAMPLE=ON
          -DCMAKE_C_FLAGS="-arch arm64"
          -S .
          && cmake --build build --config Release

      - name: clang-analyzer test
        shell: bash
        run: >
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH" &&
          export LDFLAGS="-L/opt/homebrew/opt/llvm/lib" &&
          export CFLAGS="-I/opt/homebrew/opt/llvm/include" &&
          clang-tidy -p build
          --checks='-*,clang-analyzer-*, -clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling, -clang-diagnostic-unknown-warning-option'
          -extra-arg='-Wno-unknown-warning-option'
          --warnings-as-errors='*'
          src/**/*.c

      - name: Run Test
        shell: bash
        run: |
          for file in tests/test_images/pngsuite/*.png; do
            echo $file
            build/test $file
            if [ $? -ne 0 ]; then
              exit -1
            fi
          done
          for file in tests/test_images/pngsuite_corrupted/*.png; do
            echo $file
            build/example $file
            if [ $? -ne 0 ]; then
              exit -1
            fi
          done

      - name: Run Thread Test
        shell: bash
        run: |
          set -e
          build/test --thread-test
          shopt -s nullglob
          set +e
          for file in CI_TEST-*.png; do
            cmp $file CI_TEST.png
            if [ $? -ne 0 ]; then
              echo 'fail at: cmp $file CI_TEST.png'
              exit 1
            fi
          done
          echo "pass"

      - name: Build (no test)
        run: |
          cmake -B build
          cmake --build build

  test_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up MSYS2 and Install deps
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-zlib-ng-compat
            mingw-w64-clang-x86_64-libwinpthread
            mingw-w64-clang-x86_64-libspng
            mingw-w64-clang-x86_64-compiler-rt

      - name: Build and Test with generic x86-64
        shell: msys2 {0}
        run: |
          cmake -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=ON -DBUILD_EXAMPLE=ON -DCMAKE_C_FLAGS="-march=x86-64 -fsanitize=address,undefined -fno-omit-frame-pointer" -S .
          cmake --build build --config Release
          for file in tests/test_images/pngsuite/*.png; do
            echo $file
            build/test $file
            if [ $? -ne 0 ]; then
              exit -1
            fi
          done
          for file in tests/test_images/pngsuite_corrupted/*.png; do
            echo $file
            build/example $file
            if [ $? -ne 0 ]; then
              exit -1
            fi
          done

      - name: Build and Test with SSE2
        shell: msys2 {0}
        run: |
          cmake -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=ON -DBUILD_EXAMPLE=ON -DCMAKE_C_FLAGS="-msse2 -fsanitize=address,undefined -fno-omit-frame-pointer" -S .
          cmake --build build --config Release
          for file in tests/test_images/pngsuite/*.png; do
